[package]
name = "clip"
version = "0.7.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "e6371c483905b8a39557d5b0442e0612b68f37ee" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "e6371c483905b8a39557d5b0442e0612b68f37ee" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
pollster = "1"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
# The renderer's GPU (src/render.rs): the wgpu Rune draws with, Metal here.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
# The updater (src/updater.rs), macOS-only.
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# Linux capture (src/capture_linux.rs): the ScreenCast portal and PipeWire on Wayland, X11
# directly. Decoding and encoding go through the ffmpeg binary, so nothing links libav.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes", "xinput"] }

# The renderer's GPU (src/render.rs): the wgpu Rune draws with, on each platform's backend.
[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }

[build-dependencies]
cc = "1"

[profile.dev.package."*"]
opt-level = 2
debug = false
