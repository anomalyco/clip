[package]
name = "clip"
version = "0.8.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "563be4feacd80ab4b507a6deaef93afe1879321a" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "563be4feacd80ab4b507a6deaef93afe1879321a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
pollster = "1"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
# The renderer's GPU (src/render.rs): the wgpu Rune draws with, Metal here.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
# The updater (src/updater.rs), macOS-only.
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# Linux capture (src/capture_linux.rs): the ScreenCast portal and PipeWire on Wayland, X11
# directly. Decoding and encoding go through the ffmpeg binary, so nothing links libav.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes", "xinput"] }

# The renderer's GPU (src/render.rs): the wgpu Rune draws with, on each platform's backend.
[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }

# Windows: the screen through Windows.Graphics.Capture and the recording's encoder
# (src/capture_windows.rs), Media Foundation for the decoder (src/pipeline_windows.rs), the
# keyboard hook (src/hotkey_windows.rs), the pointer (src/track_windows.rs), the system sounds
# (src/sound.rs), and the gif crate for GIF exports (src/gif_windows.rs).
[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_System_WinRT", "Win32_System_SystemInformation", "Win32_Media_MediaFoundation", "Win32_Media_Audio",
] }
gif = "0.14"

[build-dependencies]
cc = "1"

[profile.dev.package."*"]
opt-level = 2
debug = false
