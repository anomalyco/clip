name: Release

# Builds, signs, and publishes Clip for macOS from one exact commit to the
# Anomaly release service (docs/releasing.md), split the way Hex's release is:
#
# - build-macos runs repository code (cargo, scripts/bundle.sh). It has no
#   environment, no secrets, and no id-token, and it makes an unsigned app.
# - sign-macos and publish run in the release environment. They check out only
#   .github/release/ and run only those scripts and SHA-pinned actions, on
#   artifacts they treat as data: they never build, install dependencies, or
#   execute repository code or the artifacts.
# - every artifact carries a SHA256SUMS whose digest the job that made it
#   reports as an output; every job that downloads it checks that digest
#   (.github/release/verify-artifacts.sh), so nothing swapped in between
#   jobs is signed or published.
#
# The release service authorizes the publish job by its OIDC token:
# anomalyco/clip, this file, environment release, the dev channel from dev and
# stable from production (anomalyco/release registry/clip.json).
#
# Channels (.github/release/plan.sh):
# - dev: every push to dev (except docs and Markdown) publishes
#   0.0.0-dev-<run number> on the dev channel. Versions are display text:
#   installs follow the channel's current release and never compare versions.
# - check: a dispatch from dev builds, signs, and verifies the same and
#   publishes nothing; its last job pushes and deletes a throwaway
#   v0.0.0-test-<run> tag to prove it can tag.
# - stable: a dispatch from production publishes the Cargo.toml version. Only
#   after it published does the last job tag v<version> on the released commit
#   and create the GitHub release (Latest, with Clip.dmg and Clip.zip), so a
#   failed run leaves no tag. A dev build gets a GitHub prerelease the same
#   way, tagged v0.0.0-dev-<run>.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to release
        required: true
        default: production
      channel:
        description: check (build, sign, and verify; publish nothing), dev (the dev channel; run from dev), or stable (public)
        type: choice
        options: [check, dev, stable]
        default: check
  push:
    branches: [dev]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
  # Releases never cancel each other: the running one finishes, and of the
  # pushes that land meanwhile only the newest waits.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CLIP_TEAM_ID: 9G68SMNHEU

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      service: ${{ steps.plan.outputs.service }}
      tag: ${{ steps.plan.outputs.tag }}
      notes-url: ${{ steps.plan.outputs.notes-url }}
      release-channel: ${{ steps.plan.outputs.release-channel }}
      release-version: ${{ steps.plan.outputs.release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          sparse-checkout: |
            /.github/release/
            /Cargo.toml
            /docs/releases/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        run: SHA=$(git rev-parse HEAD) bash .github/release/plan.sh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
          GH_TOKEN: ${{ github.token }}

  # ---- Build: repository code; no environment, secrets, or id-token ----------

  # Clip.app at the release's version and channel, ad-hoc signed; sign-macos
  # signs it with the Developer ID.
  build-macos:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CLIP_VERSION: ${{ needs.plan.outputs.release-version }}
      CLIP_BUILD_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build Clip.app
        run: |
          CLIP_RELEASE_UNSIGNED=1 scripts/bundle.sh
          mkdir -p "$RUNNER_TEMP/macos"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent target/Clip.app "$RUNNER_TEMP/macos/Clip.app.zip"
      - id: upload
        uses: ./.github/release/upload
        with:
          name: build-macos-arm64
          path: ${{ runner.temp }}/macos

  # ---- Sign: release environment; only .github/release/ is checked out -------

  # Signs Clip.app with the Developer ID, notarizes and staples it, and makes
  # the updater zip and the DMG from the stapled app. Without the Apple values,
  # dev and check publish nothing; stable fails.
  sign-macos:
    needs: [plan, build-macos]
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    env:
      CLIP_VERSION: ${{ needs.plan.outputs.release-version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    outputs:
      signed: ${{ steps.credentials.outputs.available }}
      digest: ${{ steps.upload.outputs.digest }}
    steps:
      - &checkout-release
        name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: credentials
        name: Require the Apple values
        env:
          CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=
          [ -n "$CERTIFICATE" ] || missing="$missing APPLE_SIGNING_CERTIFICATE"
          [ -n "$KEY" ] || missing="$missing APPLE_NOTARY_KEY"
          [ -n "$KEY_ID" ] || missing="$missing APPLE_NOTARY_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APPLE_NOTARY_ISSUER_ID"
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$CHANNEL" = stable ]; then
            echo "::error::Stable releases need the macOS build, and the release environment lacks:$missing."
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish: the release environment lacks$missing." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download
        if: steps.credentials.outputs.available == 'true'
        uses: ./.github/release/download
        with:
          pattern: build-macos-arm64
          digests: build-macos-arm64=${{ needs.build-macos.outputs.digest }}
      - name: Import the certificate and notary key
        if: steps.credentials.outputs.available == 'true'
        run: bash .github/release/macos-credentials.sh "$RUNNER_TEMP/credentials"
        env:
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      - name: Sign, notarize, and staple
        if: steps.credentials.outputs.available == 'true'
        run: bash .github/release/sign-macos.sh "$RUNNER_TEMP/in/build-macos-arm64/Clip.app.zip" "$RUNNER_TEMP/out"
        env:
          CLIP_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          CLIP_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
      - name: Remove the credentials
        if: always() && steps.credentials.outputs.available == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/credentials/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/credentials"
      - id: upload
        if: steps.credentials.outputs.available == 'true'
        uses: ./.github/release/upload
        with:
          name: sign-macos
          path: ${{ runner.temp }}/out

  # ---- Verify: repository code on the signed files; no secrets ----------------

  # What a user's Mac and the in-app updater check.
  verify-macos:
    needs: [plan, sign-macos]
    if: needs.sign-macos.outputs.signed == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CLIP_VERSION: ${{ needs.plan.outputs.release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/release/download
        with:
          pattern: sign-macos
          digests: sign-macos=${{ needs.sign-macos.outputs.digest }}
      - name: Check the signed app and DMG
        run: |
          dmg="$RUNNER_TEMP/in/sign-macos/clip-$CLIP_VERSION-macos-arm64.dmg"
          zip="$RUNNER_TEMP/in/sign-macos/clip-$CLIP_VERSION-macos-arm64.zip"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          check=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$check/dmg" "$dmg"
          /usr/bin/ditto -x -k "$zip" "$check/update"
          for app in "$check/dmg/Clip.app" "$check/update/Clip.app"; do
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$CLIP_VERSION" ]
            xcrun stapler validate "$app"
            # What the in-app updater requires before it swaps the bundle in.
            codesign --verify --deep --strict -R="$(cat scripts/update-requirement.txt)" "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
          diff -qr "$check/dmg/Clip.app" "$check/update/Clip.app"
          hdiutil detach -quiet "$check/dmg"
          codesign -dv "$check/update/Clip.app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority=Developer)' >> "$GITHUB_STEP_SUMMARY"

  # ---- Publish: release environment; only .github/release/ is checked out ----

  # The only job that publishes to the release service; its OIDC token is the
  # credential.
  publish:
    needs: [plan, sign-macos, verify-macos]
    if: needs.plan.outputs.channel != 'check' && needs.verify-macos.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ needs.plan.outputs.service }}
      CLIP_VERSION: ${{ needs.plan.outputs.release-version }}
      CLIP_RELEASE_CHANNEL: ${{ needs.plan.outputs.release-channel }}
    steps:
      - *checkout-release
      - name: Download
        uses: ./.github/release/download
        with:
          pattern: sign-macos
          digests: sign-macos=${{ needs.sign-macos.outputs.digest }}
      - name: Publish
        env:
          NOTES_URL: ${{ needs.plan.outputs.notes-url }}
        run: |
          dist="$RUNNER_TEMP/in/sign-macos"
          bash .github/release/release-service.sh publish "$dist" "$NOTES_URL"
          { echo '### Manifest'; echo '```json'; cat "$dist/manifest.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Last, once the release service published: tags v<version> on the released
  # commit and mirrors the files to its GitHub release (a prerelease for dev),
  # with the built-in token; a failed run leaves no tag. A check run pushes and
  # deletes a throwaway v0.0.0-test-<run> tag to prove the token can tag.
  github:
    name: Tag and GitHub release
    needs: [plan, sign-macos, verify-macos, publish]
    if: >-
      ${{ !cancelled() && (
        (needs.plan.outputs.channel != 'check' && needs.publish.result == 'success')
        || (needs.plan.outputs.channel == 'check' && needs.verify-macos.result == 'success') ) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      CLIP_VERSION: ${{ needs.plan.outputs.release-version }}
      CLIP_RELEASE_COMMIT: ${{ needs.plan.outputs.sha }}
      CLIP_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      CLIP_RELEASE_SOURCE: ${{ github.workspace }}
    steps:
      # Credentials stay so the job can push the tag; it runs no repository
      # code beyond .github/release/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: |
            /.github/release/
            /docs/releases/
          sparse-checkout-cone-mode: false
      - name: Tag
        env:
          CLIP_RELEASE_TAG_TEST: ${{ needs.plan.outputs.channel == 'check' && '1' || '' }}
        run: bash .github/release/tag-release.sh
      - name: Download
        if: needs.plan.outputs.channel != 'check'
        uses: ./.github/release/download
        with:
          pattern: sign-macos
          digests: sign-macos=${{ needs.sign-macos.outputs.digest }}
      - name: GitHub release
        if: needs.plan.outputs.channel != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release/publish-github-release.sh "$RUNNER_TEMP/in/sign-macos"
