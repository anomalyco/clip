name: Verify AWS secrets

# Temporary: proves the release environment can assume clip-release and read
# the shared Apple secrets. Delete once the check passed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/clip-release
          role-session-name: clip-verify-${{ github.run_id }}
          aws-region: us-east-1
      - name: Fetch the release secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            APPLE_SIGNING_CERTIFICATE,shared/APPLE_SIGNING_CERTIFICATE
            APPLE_NOTARY_KEY,shared/APPLE_NOTARY_KEY
          parse-json-secrets: false
      - name: Check the certificate and the notary key
        run: |
          set -euo pipefail
          [ -n "$APPLE_SIGNING_CERTIFICATE" ] || { echo "::error::shared/APPLE_SIGNING_CERTIFICATE is empty"; exit 1; }
          [ -n "$APPLE_NOTARY_KEY" ] || { echo "::error::shared/APPLE_NOTARY_KEY is empty"; exit 1; }
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          printf '%s' "$APPLE_SIGNING_CERTIFICATE" | tr -d '\r\n ' | base64 -d > "$temp/certificate.p12" ||
            { echo "::error::shared/APPLE_SIGNING_CERTIFICATE is not base64"; exit 1; }
          [ -s "$temp/certificate.p12" ] || { echo "::error::the certificate decodes to nothing"; exit 1; }
          # A macOS-made .p12 may use RC2, which OpenSSL 3 reads only with -legacy.
          if ! openssl pkcs12 -in "$temp/certificate.p12" -nokeys -passin pass: -clcerts -out "$temp/cert.pem" 2>/dev/null; then
            openssl pkcs12 -in "$temp/certificate.p12" -nokeys -passin pass: -clcerts -legacy -out "$temp/cert.pem"
          fi
          subject=$(openssl x509 -in "$temp/cert.pem" -noout -subject -nameopt RFC2253)
          echo "certificate: ${subject}"
          case "$subject" in
            *"CN=Developer ID Application:"*"(9G68SMNHEU)"*) ;;
            *) echo "::error::the certificate is not a Developer ID Application for team 9G68SMNHEU"; exit 1 ;;
          esac
          case "$APPLE_NOTARY_KEY" in
            -----BEGIN*) printf '%s\n' "$APPLE_NOTARY_KEY" > "$temp/key.p8" ;;
            *) printf '%s' "$APPLE_NOTARY_KEY" | tr -d '\r\n ' | base64 -d > "$temp/key.p8" ;;
          esac
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$temp/key.p8" ||
            { echo "::error::shared/APPLE_NOTARY_KEY is not an App Store Connect API key (.p8)"; exit 1; }
          echo "notary key: ok"
